version: "1.0"
type: component
data:
  name: omv-storage-spindown-settings-form-page
  type: formPage
  config:
    request:
      service: Spindown
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: hint
        hintType: info
        text: _("Some hard disks, notably WD Red drives, stop going to sleep by themselves even though a Spindown time is set in Storage › Disks. Turn this on and the NAS puts them to sleep itself once they have been idle for that long. Sleeping disks are never woken to check on them.")
      - type: checkbox
        name: enable
        label: _("Spin down idle disks")
        value: false
      - type: textarea
        name: disks
        label: _("Disks and their spindown time")
        readonly: true
        submitValue: false
        rows: 2
        hint: _("Change a disk's time, or turn it off for one disk, in Storage › Disks (edit the disk, Spindown time).")
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/storage/spindown"
      - text: _("Storage › Disks")
        execute:
          type: url
          url: "/storage/disks"
