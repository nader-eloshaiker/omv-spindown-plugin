# GitHub Pages site for openmediavault-spindown (built from /docs).
title: openmediavault-spindown
description: >-
  Free OpenMediaVault plugin that makes idle hard disks sleep when they
  ignore their spindown time, such as WD Red drives. Never wakes a disk.
url: https://nader-eloshaiker.github.io
baseurl: /omv-spindown-plugin
lang: en
# Preview image for links shared on social sites and chat apps.
image: /images/banner.png
theme: jekyll-theme-cayman
# GoatCounter site code (https://<code>.goatcounter.com), a cookie-free
# visitor counter; leave empty to turn it off.
goatcounter: omv-spindown-plugin
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
# Who made the sites, for search engines (jekyll-seo-tag).
author:
  name: Nader Eloshaiker
  url: https://github.com/nader-eloshaiker
social:
  name: Nader Eloshaiker
  links:
    - https://github.com/nader-eloshaiker
    - https://medium.com/@nader.eloshaiker

defaults:
  - scope: {path: ""}
    values: {image: /images/banner.png}
  - scope: {path: googlef4b3a21d0a442387.html}
    values: {sitemap: false}

github:
  is_project_page: true
  repository_url: https://github.com/nader-eloshaiker/omv-spindown-plugin
# Maintainer notes, not useful to visitors.
exclude:
  - seo-notes.md
