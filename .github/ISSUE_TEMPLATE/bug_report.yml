name: Bug report
description: Something does not work as described, or a disk does not sleep.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form: report it privately
        (see SECURITY.md). Please remove serial numbers, host names and IP
        addresses from anything you paste.
  - type: input
    id: disks
    attributes:
      label: Disk models, and how they are connected
      placeholder: "WD Red WD40EFRX, SATA on the motherboard"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, OMV and kernel versions
      placeholder: "openmediavault-spindown 8.0.0, OMV 8.5, 6.17.2-1-pve"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `spindownd status` and `journalctl -u spindownd -n 50`
      render: text
